<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    > 
    <title>Audio Steganography Sandbox</title>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="mb-3">Audio Steganography</h1>
                <p class="text-muted mb-4"> Upload an audio file and enter a secret message to begin a steganography experiment</p>
                <form id="audioStegoForm">

                    <div class="mb-3">
                        <label for="audioUpload">Select an audio file:</label>
                        <input
                            type="file"
                            id="audioUpload"
                            name="audioUpload"
                            accept=".wav,audio/wav"
                            class="form-control"
                            required
                        >        
                    </div>

                    <div class="mb-3">
                        <label for="secretMessage">Secret Message:</label>
                    <textarea
                        id="secretMessage"
                        name="secretMessage"
                        rows="5"
                        cols="40"
                        placeholder="Enter the message you want to hide..."
                        class="form-control"
                        required
                    ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="passphrase">Passphrase:</label>
                        <input
                            type="password"
                            id="passphrase"
                            name="passphrase"
                            placeholder="Enter a passphrase"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Embed Message</button>
                </form>

                <div id="statusMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite">
                </div>

                <script>
                    const form = document.getElementById('audioStegoForm');
                    const statusMessage = document.getElementById('statusMessage');

                    form.addEventListener("submit", function(event) {
                        event.preventDefault();

                        statusMessage.textContent = "Audio file and message validated. Ready for steganography processing.";
                    });
                </script>

            </div>
        </div>
    </div>
</body>
</html>
