<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    > 
    <title>Audio Steganography Sandbox</title>
</head>

<body class="bg-light">
    <div class="container py-5"><nav class="mb-4" aria-label="Sandbox navigation">
        <a class="btn btn-outline-primary" href="/">
            Image Sandbox
        </a>

        <a class="btn btn-primary" href="/audio">
            Audio Sandbox
        </a>
        <a class="btn btn-outline-primary" href="/zero-width">
            Zero-Width Text
        </a>
        </nav>
        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="mb-3">Audio Steganography</h1>
                <p class="text-muted mb-4"> Upload an audio file and enter a secret message to begin a steganography experiment</p>
                <form id="audioStegoForm">

                    <div class="mb-3">
                        <label for="audioUpload">Select an audio file:</label>
                        <input
                            type="file"
                            id="audioUpload"
                            name="audioUpload"
                            accept=".wav,audio/wav"
                            class="form-control"
                            required
                        >        
                    </div>

                    <div class="mb-3">
                        <label for="secretMessage">Secret Message:</label>
                    <textarea
                        id="secretMessage"
                        name="secretMessage"
                        rows="5"
                        cols="40"
                        placeholder="Enter the message you want to hide..."
                        class="form-control"
                        required
                    ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="passphrase">Passphrase:</label>
                        <input
                            type="password"
                            id="passphrase"
                            name="passphrase"
                            placeholder="Enter a passphrase"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Embed Message</button>
                </form>

                <div id="statusMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite">
                </div>

                <script>
                    const audioForm = document.getElementById("audioStegoForm");
                    const audioInput = document.getElementById("audioUpload");
                    const messageInput = document.getElementById("secretMessage");
                    const passphraseInput = document.getElementById("passphrase");
                    const audioStatus = document.getElementById("statusMessage");
                    const audioButton = audioForm.querySelector('button[type="submit"]');

                    audioForm.addEventListener("submit", async (event) => {
                        event.preventDefault();

                        const audio = audioInput.files[0];
                        const message = messageInput.value;
                        const passphrase = passphraseInput.value;

                    if (!audio) {
                        audioStatus.textContent = "Please select a WAV file.";
                        return;
                    }

                    audioButton.disabled = true;
                    audioStatus.textContent = "Uploading and validating WAV file...";

                    try {
                        const formData = new FormData();
                        formData.append("audio", audio);

                        const uploadResponse = await fetch("/api/v1/audio/uploads", {
                            method: "POST",
                            body: formData
                    });

                        const uploadResult = await uploadResponse.json();

                        if (!uploadResponse.ok) {
                            throw new Error(uploadResult.error || "Audio upload failed.");
                    }
                        audioStatus.textContent = "Encrypting and embedding message in audio...";

                        const encodeResponse = await fetch("/api/v1/audio/encode", {
                            method: "POST",
                            headers: {
                            "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                audio_id: uploadResult.audio_id,
                                message: message,
                                passphrase: passphrase
                                })
                            });

                    const encodeResult = await encodeResponse.json();

                    if (!encodeResponse.ok) {
                        throw new Error(encodeResult.error || "Audio encoding failed.");
                        }
                        audioStatus.innerHTML = `
                            <strong>Message embedded successfully in audio.</strong><br>
                            <a class="btn btn-success btn-sm mt-2" href="${encodeResult.download_url}">
                            Download Encoded Audio
                            </a>
                            `;

                        } catch (error) {
                            audioStatus.textContent = error.message;

                        } finally {
                            audioButton.disabled = false;
                        }
                    });
                </script>

            </div>
        </div>
    </div>
</body>
</html>
