<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Zero-Width Text Steganography Sandbox</title>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">

                <nav class="mb-4" aria-label="Sandbox navigation">
                    <a class="btn btn-outline-primary" href="/">
                        Image Sandbox
                    </a>

                    <a class="btn btn-outline-primary" href="/audio">
                        Audio Sandbox
                    </a>

                    <a class="btn btn-primary" href="/zero-width">
                        Zero-Width Text
                    </a>
                </nav>

                <h1 class="mb-3">Zero-Width Text Steganography</h1>

                <p class="text-muted mb-4">
                    Hide a secret message within ordinary text using zero-width characters.
                </p>

                <form id="zeroWidthForm">

                    <div class="mb-3">
                        <label for="coverText">Cover Text:</label>
                        <textarea
                            id="coverText"
                            name="coverText"
                            rows="5"
                            placeholder="Enter the text that will contain the hidden message..."
                            class="form-control"
                            required
                        ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="secretMessage">Secret Message:</label>
                        <textarea
                            id="secretMessage"
                            name="secretMessage"
                            rows="5"
                            placeholder="Enter the message you want to hide..."
                            class="form-control"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Embed Message
                    </button>

                </form>

                <div
                    id="statusMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite">
                </div>

            </div>
        </div>
    </div>
</body>

</html>
