<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Zero-Width Text Steganography Sandbox</title>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">

                <nav class="mb-4" aria-label="Sandbox navigation">
                    <a class="btn btn-outline-primary" href="/">
                        Image Sandbox
                    </a>

                    <a class="btn btn-outline-primary" href="/audio">
                        Audio Sandbox
                    </a>

                    <a class="btn btn-primary" href="/zero-width">
                        Zero-Width Text
                    </a>
                </nav>

                <h1 class="mb-3">Zero-Width Text Steganography</h1>

                <p class="text-muted mb-4">
                    Hide a secret message within ordinary text using zero-width characters.
                </p>

                <form id="zeroWidthForm">

                    <div class="mb-3">
                        <label for="coverText">Cover Text:</label>
                        <textarea
                            id="coverText"
                            name="coverText"
                            rows="5"
                            placeholder="Enter the text that will contain the hidden message..."
                            class="form-control"
                            required
                        ></textarea>
                    </div>
                    <div class="mt-4">
                        <label for="encodedText" class="form-label">
                            Encoded Cover Text
                        </label>

                        <textarea
                            id="encodedText"
                            rows="6"
                            class="form-control"
                            readonly
                            placeholder="Your encoded text will appear here..."
                        ></textarea>

                        <button
                            id="copyButton"
                            type="button"
                            class="btn btn-success btn-sm mt-2"
                            disabled
                        >
                            Copy Encoded Text
                        </button>
                    </div>

                    <div class="mb-3">
                        <label for="secretMessage">Secret Message:</label>
                        <textarea
                            id="secretMessage"
                            name="secretMessage"
                            rows="5"
                            placeholder="Enter the message you want to hide..."
                            class="form-control"
                            required
                        ></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="passphrase" class="form-label">Passphrase</label>

                        <input
                            type="password"
                            id="passphrase"
                            name="passphrase"
                            minlength="1"
                            placeholder="Use at least 1 character"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Embed Message
                    </button>

                </form>

                <div
                    id="statusMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite">
                </div>

            </div>
        </div>
    </div>
            <script>
        const zeroWidthForm = document.getElementById("zeroWidthForm");
        const coverTextInput = document.getElementById("coverText");
        const secretMessageInput = document.getElementById("secretMessage");
        const passphraseInput = document.getElementById("passphrase");
        const statusMessage = document.getElementById("statusMessage");
        const encodedText = document.getElementById("encodedText");
        const copyButton = document.getElementById("copyButton");

        zeroWidthForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            try {
            const response = await fetch("/api/v1/zero-width/encode", {
                method: "POST",
                headers: {
                "Content-Type": "application/json"
                },
                body: JSON.stringify({
                cover_text: coverTextInput.value,
                message: secretMessageInput.value,
                passphrase: passphraseInput.value
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Text encoding failed.");
            }

            encodedText.value = result.encoded_text;
            copyButton.disabled = false;
            statusMessage.textContent =
                "Message embedded successfully. Copy the encoded text.";
            statusMessage.className = "alert alert-success mt-3";

            } catch (error) {
            statusMessage.textContent = error.message;
            statusMessage.className = "alert alert-danger mt-3";
            }
        });

        copyButton.addEventListener("click", async () => {
            await navigator.clipboard.writeText(encodedText.value);
            statusMessage.textContent = "Encoded text copied.";
        });
        </script>
</body>

</html>
