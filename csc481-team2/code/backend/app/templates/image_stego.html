<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    > 
    <title>Image Steganography Sandbox</title>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="mb-3">Image Steganography</h1>
                <p class="text-muted mb-4"> Upload an image and enter a secret message to begin a steganography experiment</p>
                <form id="imageStegoForm">

                    <div class="mb-3">
                        <label for="imageUpload">Select an image:</label>
                        <input
                            type="file"
                            id="imageUpload"
                            name="imageUpload"
                            accept="image/png"
                            class="form-control"
                            required
                        >        
                    </div>

                    <div class="mb-3">
                        <label for="secretMessage">Secret Message:</label>
                    <textarea
                        minlength="1"
                        maxlength="500"
                        id="secretMessage"
                        name="secretMessage"
                        rows="5"
                        cols="40"
                        placeholder="Enter the message you want to hide..."
                        class="form-control"
                        required
                    ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="passphrase">Passphrase:</label>
                        <input
                            type="password"
                            id="passphrase"
                            name="passphrase"
                            placeholder="Enter a passphrase"
                            class="form-control"
                            required
                        >
                    </div>

                    <button id="embedButton" type="submit" class="btn btn-primary">
                        Embed Message
                    </button>
                </form>

                <div id="statusMessage"
                    class="mt-3"
                    role="status"
                    aria-live="polite">
                </div>
                <script>
                    const form = document.getElementById("imageStegoForm");
                    const imageInput = document.getElementById("imageUpload");
                    const messageInput = document.getElementById("secretMessage");
                    const passphraseInput = document.getElementById("passphrase");
                    const embedButton = document.getElementById("embedButton");
                    const statusMessage = document.getElementById("statusMessage");

                    form.addEventListener("submit", async (event) => {
                        event.preventDefault();

                        const image = imageInput.files[0];
                        const message = messageInput.value;
                        const passphrase = passphraseInput.value;

                        if (!image) {
                        statusMessage.textContent = "Please select a PNG image.";
                        return;
                        }

                        embedButton.disabled = true;
                        statusMessage.textContent = "Uploading and validating image...";

                        try {
                        const formData = new FormData();
                        formData.append("image", image);

                        const uploadResponse = await fetch("/api/v1/uploads", {
                            method: "POST",
                            body: formData
                        });

                        const uploadResult = await uploadResponse.json();

                        if (!uploadResponse.ok) {
                            throw new Error(uploadResult.error || "Image upload failed.");
                        }

                        statusMessage.textContent = "Encrypting and embedding message...";

                        const encodeResponse = await fetch("/api/v1/encode", {
                            method: "POST",
                            headers: {
                            "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                            upload_id: uploadResult.upload_id,
                            message: message,
                            passphrase: passphrase
                            })
                        });

                        const encodeResult = await encodeResponse.json();

                        if (!encodeResponse.ok) {
                            throw new Error(encodeResult.error || "Message embedding failed.");
                        }

                        statusMessage.innerHTML = `
                            <strong>Message embedded successfully.</strong><br>
                            <a class="btn btn-success btn-sm mt-2" href="${encodeResult.download_url}">
                            Download Encoded Image
                            </a>
                        `;

                        } catch (error) {
                        statusMessage.textContent = error.message;
                        } finally {
                        embedButton.disabled = false;
                        }
                    });
                    </script>

            </div>
        </div>
    </div>
</body>
</html>
