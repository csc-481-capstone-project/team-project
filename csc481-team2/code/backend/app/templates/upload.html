<form id="upload-form">
  <div class="mb-3">
    <label for="image" class="form-label">PNG image</label>

    <input
      id="image"
      name="image"
      type="file"
      class="form-control"
      accept="image/png"
      required
    >
  </div>

  <button id="upload-button" type="submit" class="btn btn-primary">
    Upload
  </button>
  <button
  id="encode-button"
  type="button"
  class="btn btn-success ms-2"
  disabled
  >
  Encode Message
  </button>
</form>

<div id="status" class="mt-3" aria-live="polite"></div>
<script>
  const form = document.getElementById("upload-form");
  const imageInput = document.getElementById("image");
  const messageInput = document.getElementById("message");
  const uploadButton = document.getElementById("upload-button");
  const encodeButton = document.getElementById("encode-button");
  const status = document.getElementById("status");

  // If the image was uploaded earlier in this browser session,
  // allow the user to encode a message.
  if (sessionStorage.getItem("upload_id")) {
    encodeButton.disabled = false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const image = imageInput.files[0];

    if (!image) {
      status.textContent = "Please choose a PNG image.";
      status.className = "alert alert-danger mt-3";
      return;
    }

    const formData = new FormData();
    formData.append("image", image);

    uploadButton.disabled = true;
    encodeButton.disabled = true;
    status.textContent = "Uploading and validating image...";
    status.className = "alert alert-info mt-3";

    try {
      const response = await fetch("/api/v1/uploads", {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Upload failed.");
      }

      sessionStorage.setItem("upload_id", result.upload_id);

      status.textContent = "Image uploaded. Enter a message, then select Encode Message.";
      status.className = "alert alert-success mt-3";

      encodeButton.disabled = false;

    } catch (error) {
      status.textContent = error.message;
      status.className = "alert alert-danger mt-3";
    } finally {
      uploadButton.disabled = false;
    }
  });

  encodeButton.addEventListener("click", async () => {
    const uploadId = sessionStorage.getItem("upload_id");
    const message = messageInput.value;

    if (!uploadId) {
      status.textContent = "Upload a PNG image before encoding.";
      status.className = "alert alert-danger mt-3";
      return;
    }

    if (!message.trim()) {
      status.textContent = "Enter a message to encode.";
      status.className = "alert alert-danger mt-3";
      return;
    }

    encodeButton.disabled = true;
    status.textContent = "Encoding your message into the image...";
    status.className = "alert alert-info mt-3";

    try {
      const response = await fetch("/api/v1/encode", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          upload_id: uploadId,
          message: message
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Encoding failed.");
      }

      status.innerHTML = `
      <strong>Message encoded successfully.</strong><br>
      <a
      class="btn btn-success btn-sm mt-2"
      href="${result.download_url}"
      >
        Download Encoded Image
      </a>
      `;
      status.className = "alert alert-success mt-3";

    } catch (error) {
      status.textContent = error.message;
      status.className = "alert alert-danger mt-3";
    } finally {
      encodeButton.disabled = false;
    }
  });
</script>
<div class="mb-3">
  <label for="message" class="form-label">Secret message</label>

  <textarea
    id="message"
    name="message"
    class="form-control"
    rows="4"
    maxlength="500"
    placeholder="Type the message you want to hide..."
  ></textarea>

  <div class="form-text">
    Maximum 500 characters for the first version.
  </div>
</div>
